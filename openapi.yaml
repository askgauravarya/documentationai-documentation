openapi: 3.0.3
info:
  version: '1.0.0'
  title: Deepvue Verification Workflows API
  description: >
    The Deepvue `/v1` partner API: authenticate, trigger verification workflows,
    poll runs to completion, resolve human reviews, and read verification reports.


    Partners authenticate every request with two headers, `client-id` and `x-api-key`.
    Keep `x-api-key` server-side; it is a secret and must never be exposed in a browser
    or mobile client.


    All timestamps are RFC 3339 UTC. Optional fields are omitted from the JSON rather
    than sent as `null`. The two exceptions are `action_required` and `error`, which are
    always present and explicitly `null` when not applicable. Unknown JSON fields in a
    request body are rejected, not silently ignored.
  contact:
    name: Deepvue Support
    url: https://deepvue.ai
servers:
  - url: https://api.deepvue.link
    description: Production

security:
  - clientId: []
    apiKey: []

tags:
  - name: Workflows
    description: Discover workflows and the checks they can run.
  - name: Runs
    description: Start runs, poll them to a terminal status, and read results.
  - name: Reviews
    description: Record a human verdict on a run.

paths:
  /v1/workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      operationId: listWorkflows
      description: Returns the workflows available to your account.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of workflows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Workflow'
        '400':
          description: '`invalid limit` or `invalid offset`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
              examples:
                invalidLimit:
                  value: { error: 'invalid limit' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/workflows/{id}:
    get:
      tags: [Workflows]
      summary: Get one workflow
      operationId: getWorkflow
      description: >
        Returns the workflow plus `steps` - every check key that can appear in a run's
        `checks[]`, so you can build your result mapping before running anything.


        `steps` is a superset: workflows branch, so a single run produces a subset of these
        keys. A key that never arrives means that branch was not taken, not that something
        failed. Order is indicative, not guaranteed.
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: The workflow, with its steps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetail'
        '400':
          description: '`invalid id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '404':
          description: '`not found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/workflows/{id}/runs:
    post:
      tags: [Runs]
      summary: Start a run
      operationId: startRun
      description: >
        Starts a run of the workflow.


        For interactive workflows the response blocks briefly and already carries
        `action_required.url`, so no poll is needed to obtain the link. If the wait times
        out you receive a non-terminal status with `action_required: null` - poll
        `GET /v1/runs/{id}` for the link.
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
            examples:
              interactiveKyc:
                summary: Interactive KYC journey
                value:
                  reference_id: user_123
                  input:
                    pan_number: ABCDE1234F
                    mobile: '9876543210'
                  redirect_uri: https://your-app.example.com/kyc/done
      responses:
        '202':
          description: >
            Run accepted. List shape - no `checks`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                waitingOnCustomer:
                  $ref: '#/components/examples/RunWaitingOnCustomer'
        '400':
          description: >
            `reference_id is required`, `invalid workflow id`, a redirect-URI validation
            message, or an `INSUFFICIENT_BALANCE` error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
              examples:
                missingReference:
                  value: { error: 'reference_id is required' }
                insufficientBalance:
                  value: { error: 'insufficient balance', code: 'INSUFFICIENT_BALANCE' }
        '404':
          description: '`workflow not found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/workflows/{id}/webhook:
    post:
      tags: [Workflows]
      summary: Set the run-completion webhook
      operationId: setWorkflowWebhook
      description: >
        Add-only: sets the URL when none is configured, `409` otherwise.
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifecycle_webhook_url]
              additionalProperties: false
              properties:
                lifecycle_webhook_url:
                  type: string
                  format: uri
                  description: An absolute http(s) URL.
                  example: https://your-app.example.com/hooks/kyc
      responses:
        '201':
          description: The updated workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: '`lifecycle_webhook_url must be an absolute http(s) URL`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '409':
          description: '`webhook already configured for this workflow`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/runs:
    get:
      tags: [Runs]
      summary: List runs
      operationId: listRuns
      description: >
        Returned newest first (`started_at` DESC). List shape - `checks`, `reviews`, and
        the decision fields are deliberately absent; list to find runs, then
        `GET /v1/runs/{id}` to read results.


        `status` and `decision` are independent axes and are AND-ed together. Every pairing
        is legal; `?status=completed&decision=review` - runs that look finished but are not -
        is the most useful one.


        `?status=failed` does not return expired runs. Query both if you mean
        "everything that halted badly".
      parameters:
        - name: workflow_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Any one of the six run statuses.
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: decision
          in: query
          required: false
          description: Where a human verdict stands - an axis independent of `status`.
          schema:
            $ref: '#/components/schemas/Decision'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of runs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Run'
        '400':
          description: Invalid `status` or `decision`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
              examples:
                invalidStatus:
                  value:
                    error: 'invalid status (supported: completed, cancelled, expired, failed, in_progress, abandoned)'
                invalidDecision:
                  value:
                    error: 'invalid decision (supported: review, approve, reject)'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/runs/{id}:
    get:
      tags: [Runs]
      summary: Get one run
      operationId: getRun
      description: >
        Detail shape - includes `checks`, `reviews`, and the decision fields.


        Pass `?view=report` to replace the response body with the report's content model:
        the same document `GET /v1/runs/{id}/report.pdf` is printed from, before rendering.
        Use it to display results in your own UI without parsing a PDF.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: view
          in: query
          required: false
          description: Set to `report` to return the report content model instead of the run.
          schema:
            type: string
            enum: [report]
      responses:
        '200':
          description: The run, or the report content model when `?view=report` is set.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RunDetail'
                  - $ref: '#/components/schemas/Report'
              examples:
                completed:
                  $ref: '#/components/examples/RunCompleted'
                failedOnCheck:
                  $ref: '#/components/examples/RunFailedOnCheck'
                expired:
                  $ref: '#/components/examples/RunExpired'
        '400':
          description: '`invalid run id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '404':
          description: '`run not found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '503':
          description: '`report generation is not configured` (only with `?view=report`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/runs/{id}/report.pdf:
    get:
      tags: [Runs]
      summary: Get the verification report as PDF
      operationId: getRunReportPdf
      description: >
        Returns the rendered verification report for a terminal run as a PDF document,
        suitable for archiving or sharing with the subject.


        Operator notes recorded during review are deliberately excluded from this document.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The rendered report.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: '`run not found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '503':
          description: '`report generation is not configured`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/runs/{id}/cancel:
    post:
      tags: [Runs]
      summary: Cancel a run
      operationId: cancelRun
      description: >
        Cancels a non-terminal run. A cancelled run leaves `?decision=review` and is never
        reported there again. No request body.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run was cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [cancelled]
                example:
                  id: 1e30a341-cb3b-48b8-9992-99a1b436b8d9
                  status: cancelled
        '404':
          description: '`run not found or already terminal`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/signals/{run_id}/{signal_name}:
    post:
      tags: [Reviews]
      summary: Deliver a signal to a run
      operationId: sendSignal
      description: >
        Delivers a signal to a run. The signal name comes from `action_required.signal_name`
        on a non-terminal run; the review signal is `human_review_decision`.


        One route, two behaviours, and the response says which. If the run is parked on a
        review step, this delivers the signal and the workflow advances -
        `"result": "signal_delivered"`. If the run has already finished, it records an
        annotation and nothing advances - `"result": "review_recorded"`. Never infer which
        happened from the run's state; read `result`.


        The verdict is the run's - there is no `node_id`, and sending one is a `400`, not an
        ignored field. Re-deciding is allowed and overwrites the previous verdict. Recording
        a verdict does not change `status` or `completed_at`, does not re-run anything, and
        fires no webhook.


        Both credential types work on this route: `client-id` + `x-api-key`, or a dashboard
        Bearer token.
      security:
        - clientId: []
          apiKey: []
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: signal_name
          in: path
          required: true
          description: e.g. `human_review_decision`, or the `signal_name` from `action_required`.
          schema:
            type: string
          example: human_review_decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              additionalProperties: false
              properties:
                payload:
                  type: object
                  description: >
                    For `human_review_decision`: `decision` is required and must be
                    `approve` or `reject`; `notes` is optional operator text.
                  properties:
                    decision:
                      type: string
                      enum: [approve, reject]
                    notes:
                      type: string
                      description: >
                        Returned by `GET /v1/runs/{id}` and `?view=report`, and deliberately
                        absent from the rendered PDF.
            examples:
              reject:
                value:
                  payload:
                    decision: reject
                    notes: KYB docs verified manually
      responses:
        '200':
          description: The signal was delivered, or the verdict was recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: string
                    enum: [signal_delivered, review_recorded]
                    description: >
                      `signal_delivered` - the run was parked on a review step and the
                      workflow advanced. `review_recorded` - the run had already finished
                      and an annotation was recorded.
                  decision:
                    type: string
                    enum: [approve, reject]
                example:
                  ok: true
                  result: review_recorded
                  decision: reject
        '400':
          description: A `node_id` was sent, or `decision` was not `approve` or `reject`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
              examples:
                nodeIdRejected:
                  value:
                    error: 'payload.node_id is no longer accepted: a review decision applies to the whole run'
                badDecision:
                  value:
                    error: 'payload rejected: decision must be "approve" or "reject"'
        '404':
          description: The run is not parked on a review step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportError'
              examples:
                noOpenSignal:
                  value: { error: 'no open signal human_review_decision for this run' }
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    clientId:
      type: apiKey
      in: header
      name: client-id
      description: Your Deepvue client identifier.
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Your Deepvue API key. Secret - keep it server-side.
    bearerAuth:
      type: http
      scheme: bearer
      description: A dashboard Bearer token. Accepted on the signals route only.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1–200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    WorkflowId:
      name: id
      in: path
      required: true
      description: The workflow's UUID.
      schema:
        type: string
        format: uuid
    RunId:
      name: id
      in: path
      required: true
      description: The run's UUID.
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: No usable credential was supplied, or the pair was rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransportError'
          examples:
            missing:
              value: { error: 'missing credentials: send client-id + x-api-key headers' }
            invalid:
              value: { error: 'invalid Deepvue credentials' }
    Forbidden:
      description: The account exists but is not approved, or is not authorized for this API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransportError'
          examples:
            disabled:
              value: { error: 'account_disabled' }
            notAuthorized:
              value: { error: 'Deepvue account not authorized for this surface' }

  schemas:
    ListEnvelope:
      type: object
      description: >
        The fixed envelope returned by every list endpoint. `total` is the count of all
        records matching the filter, ignoring `limit` and `offset`.
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
          example: 128
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0

    TransportError:
      type: object
      description: >
        Transport errors use `{"error": "<message>"}`, and add `"code": "<CODE>"` when a
        machine-readable discriminator is available.
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string

    RunStatus:
      type: string
      description: >
        Six statuses that partition runs - every run is exactly one of them. Terminal:
        `completed`, `failed`, `expired`, `cancelled`. Non-terminal: `in_progress`,
        `abandoned`.


        `abandoned` is the only status that can un-happen: the run stays live and resumes the
        moment the customer returns. `abandoned` and `expired` are computed at read time.
      enum:
        - in_progress
        - abandoned
        - completed
        - failed
        - expired
        - cancelled

    Decision:
      type: string
      description: >
        Where a human verdict stands. `review` - a verdict is owed. `approve` / `reject` -
        someone ruled. A run needing no verdict reports `null` and appears under no value.
      enum: [review, approve, reject]

    Workflow:
      type: object
      description: The list shape, returned by `GET /v1/workflows` and the webhook endpoint.
      required: [id, name, published, run_ttl_seconds, abandon_timeout_seconds, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Use this to trigger runs.
        name:
          type: string
        description:
          type: string
          description: Omitted when unset.
        published:
          type: boolean
          description: '`true` = a published version exists.'
        run_ttl_seconds:
          type: integer
          description: >
            How long a run of this workflow stays usable from start. `0` = no deadline.
            Default 24h.
        abandon_timeout_seconds:
          type: integer
          description: >
            Idle window before `?status=abandoned` reports a run. `0` = off. Default 1h.
            Applied at read time - changing it re-classifies existing runs immediately,
            with no backfill.
        lifecycle_webhook_url:
          type: string
          format: uri
          description: Omitted when no per-workflow webhook is configured.
        created_at:
          type: string
          format: date-time
      example:
        id: e97e7d78-4ceb-4283-8080-5c5e0b72ddac
        name: Individual KYC
        description: PAN, e-Aadhaar and face match
        published: true
        run_ttl_seconds: 86400
        abandon_timeout_seconds: 3600
        created_at: '2026-06-01T10:00:00Z'

    WorkflowDetail:
      allOf:
        - $ref: '#/components/schemas/Workflow'
        - type: object
          required: [steps]
          properties:
            steps:
              type: array
              description: >
                The checks this workflow may run; `[]` when it has none. Only verification
                checks are listed - consent screens, document capture and decision logic are
                not, since they produce no result you receive. Reflects the version a run
                would actually execute.
              items:
                $ref: '#/components/schemas/Step'

    Step:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          description: Same vocabulary as `Check.key`.
          example: face_match
        label:
          type: string
          description: Same vocabulary as `Check.label`.
          example: Face match

    Check:
      type: object
      description: >
        One logical verification step. Stable across workflow edits - keyed by a published
        name, never by an internal node identifier. Order is execution order, oldest first.
        A step the workflow has not reached yet has no entry: absence means "not started",
        not "failed".
      required: [key, label, status]
      properties:
        key:
          type: string
          description: Stable machine name.
          example: pan
        label:
          type: string
          example: PAN verification
        status:
          type: string
          enum: [pending, running, passed, failed]
        data:
          type: object
          additionalProperties: true
          description: >
            The step's result fields; shape varies per `key`, is documented per check, and is
            stable for a given `key`. Present when the step produced output.

    ActionRequired:
      type: object
      description: >
        The run is parked waiting on a human. Present only on a non-terminal status. Read
        `type` - not `status` - to tell whether the run is waiting on one of your operators
        or on the end customer.
      required: [type, signal_name]
      properties:
        type:
          type: string
          enum: [customer_input, review]
          description: >
            `customer_input` - send the end user to `url`. `review` - an internal reviewer
            must decide.
        signal_name:
          type: string
          description: Pass to `POST /v1/signals/{run_id}/{signal_name}` to unblock.
          example: selfie_captured
        url:
          type: string
          format: uri
          description: Signed hosted-journey link. Present when `type` is `customer_input`.

    ReviewFlag:
      type: object
      description: >
        Why a run was flagged - the evidence. There is one `decision` per run; `reviews[]`
        records what raised the question.
      required: [node_id, label, reason]
      properties:
        node_id:
          type: string
          description: Which step. The same identifier `?view=report` exposes.
          example: n_face_match
        label:
          type: string
          example: Face Match
        reason:
          type: string
          example: The customer declined to provide this.

    RunError:
      type: object
      description: Present only when `status` is `failed` or `expired`.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - CHECK_FAILED
            - RETRIES_EXHAUSTED
            - SOURCE_UNAVAILABLE
            - LINK_EXPIRED
            - WORKFLOW_ERROR
          description: >
            `CHECK_FAILED` - a step returned a negative result; terminal, do not retry.
            `RETRIES_EXHAUSTED` - a step kept returning a rejected result until the attempt
            budget ran out; terminal, do not retry.
            `SOURCE_UNAVAILABLE` - an upstream source did not return a usable response;
            transient, start a new run.
            `LINK_EXPIRED` - the end user never completed an interactive step before the
            deadline; start a new run and re-issue the link.
            `WORKFLOW_ERROR` - a configuration or internal fault; not retryable, contact
            support with the `run_id`. Treat an unrecognized code as `WORKFLOW_ERROR`.
        check:
          type: string
          description: '`key` of the check the run exited on, when attributable.'
        message:
          type: string
          description: >
            A plain sentence; safe to log, not intended for end users. It never contains the
            upstream vendor response. Switch on `code`; show `message` to a person.

    Run:
      type: object
      description: >
        The list shape. `checks`, `reviews` and the decision fields are absent - list to find
        runs, then `GET /v1/runs/{id}` to read results.
      required: [id, workflow_id, reference_id, status, started_at, completed_at, action_required, error]
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        reference_id:
          type: string
          description: Echoed from the trigger request.
        status:
          $ref: '#/components/schemas/RunStatus'
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: '`null` until terminal.'
        action_required:
          allOf:
            - $ref: '#/components/schemas/ActionRequired'
          nullable: true
          description: Non-null only on a non-terminal status.
        error:
          allOf:
            - $ref: '#/components/schemas/RunError'
          nullable: true
          description: Non-null only when `status` is `failed` or `expired`.

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [decision, resolved_at]
          properties:
            checks:
              type: array
              description: Detail endpoint only; omitted when empty.
              items:
                $ref: '#/components/schemas/Check'
            decision:
              allOf:
                - $ref: '#/components/schemas/Decision'
              nullable: true
              description: >
                Always present - a value or an explicit `null` - so you test a value rather
                than a key's existence. `null` means no verdict is owed.
            notes:
              type: string
              description: >
                What the reviewer typed. Omitted (never `null`) when they typed nothing.
            resolved_at:
              type: string
              format: date-time
              nullable: true
              description: '`null` until a verdict is recorded.'
            reviews:
              type: array
              description: Detail endpoint only; omitted when the run is flagged for nothing.
              items:
                $ref: '#/components/schemas/ReviewFlag'

    StartRunRequest:
      type: object
      required: [reference_id]
      additionalProperties: false
      properties:
        reference_id:
          type: string
          description: Your identifier for the person or entity.
          example: user_123
        input:
          type: object
          additionalProperties: true
          description: Trigger data; keys are per-workflow.
        redirect_uri:
          type: string
          format: uri
          description: >
            Where to send the end user once the run is terminal. `run_id` and `status` are
            appended. Validated against your tenant's allowlist at request time.

    ReportCard:
      type: object
      required: [node_id, title, status]
      properties:
        node_id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [ok, needs_review, failed]
        note:
          type: string
          description: >
            A plain sentence from a closed set. For `needs_review` it is the workflow
            author's wording for what a negative result means; for `failed` it is fixed copy
            chosen by the error class. Never the upstream response.
        attempts:
          type: integer
        layout:
          type: string
          enum: [fields, document, screening, score]
        entries:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                description: >
                  A fresh short-lived link, minted per request. Do not store it - fetch and
                  copy the bytes, or request the run again.
              attempt: { type: integer }
              superseded: { type: boolean }
        table:
          type: object
          properties:
            title: { type: string }
            columns:
              type: array
              items: { type: string }
            rows:
              type: array
              items:
                type: array
                items: { type: string }
        tiles:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
        highlight:
          type: object
          properties:
            label: { type: string }
            value: { type: string }

    ReportSection:
      type: object
      required: [key, label, status]
      properties:
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [ok, needs_review, failed]
          description: The per-step verification roll-up.
        attempts:
          type: integer
          description: >
            How many times the customer went through the step. `1` means first time.
            Internal network retries are not counted.
        cards:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ReportCard'

    Report:
      type: object
      description: >
        The report's content model - the same document `report.pdf` is printed from, before
        rendering. Fields are an allowlist: a value appears only if its node type declares a
        title for it, which keeps raw upstream payloads, identifiers and credentials
        structurally out of this response.
      required: [run, title, decision, resolved_at, sections]
      properties:
        run:
          type: object
          properties:
            run_id: { type: string }
            reference_id: { type: string }
            workflow_name: { type: string }
            workflow_version: { type: integer }
            run_status:
              $ref: '#/components/schemas/RunStatus'
            started: { type: string, example: 'Aug 10, 2026, 3:45 PM' }
            completed: { type: string }
            duration: { type: string, example: '1m 45s' }
        title:
          type: string
          example: Identity Verification
        subject:
          type: object
          properties:
            name: { type: string }
            dob: { type: string }
            gender: { type: string }
            portrait_url: { type: string, format: uri }
        decision:
          allOf:
            - $ref: '#/components/schemas/Decision'
          nullable: true
          description: >
            The human sign-off; `run.run_status` is the journey. A run can finish every
            screen and still be owed a verdict.
        notes:
          type: string
          description: Omitted when the reviewer typed nothing.
        resolved_at:
          type: string
          format: date-time
          nullable: true
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewFlag'
        sections:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ReportSection'

